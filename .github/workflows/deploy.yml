name: Deploy

# Deploys apps/web to Vercel through the Vercel CLI (token-based), never the
# Vercel Git integration — the project stays disconnected from GitHub on the
# Vercel side (multiple GitHub accounts on the owner's machine conflict with it).
#
# The compile runs on Vercel's cloud build (not `--prebuilt` on the runner):
# Vercel's build environment natively resolves the npm-workspace packages
# (@flyee/*), which the runner-side `vercel build --prebuilt` flow breaks by
# isolating the build to the Root Directory (apps/web) and severing the
# ../../packages/* symlinks. Env vars come from the Vercel project settings.
# Setup and secrets: docs/DEPLOY.md.
#
# push to main / manual dispatch → production deploy
# pull_request                   → preview deploy (URL in the run summary)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Preview deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vercel-preview-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets — see docs/DEPLOY.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Deploy preview (Vercel cloud build)
        run: |
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "Preview: $url"
          echo "### Vercel preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets — see docs/DEPLOY.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Deploy to production (Vercel cloud build)
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "Production: $url"
          echo "### Vercel production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
