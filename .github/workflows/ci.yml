name: CI

on:
  pull_request:
  push:
    branches: [main]

# `next build` is deliberately single-process (next.config.mjs cpus:1) and its
# webpack phase needs more than Node's ~2 GB default heap on GitHub runners.
# Vercel's 8 GB build machines get --max-old-space-size=4096 from the platform;
# mirror that here for the application build and Playwright's webServer build.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:mobile:check
      - run: npm run harness:check
      - run: npm run harness:test
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run build:mobile

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:prepare
      - run: npx supabase start
      - run: npm run test:db
      - if: always()
        run: npx supabase stop --no-backup

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
